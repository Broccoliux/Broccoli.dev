<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Broccoli Activity</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/stats.css">
</head>

<body>

  <main class="stats-main">
    <section class="stats-hero">

      <p class="stats-eyebrow">ENGINNEERING ACTIVITY</p>
      <h1 id="stats-language">Software Activity</h1>

      <p class="stats-description">
        Detailed development activity, projects, and time spent building.
      </p>
    </section>

    <section>
      <div class="stat-card">
        <span>Total Time</span>
        <strong id="total-hours">--</strong>
      </div>

      <div class="stat-card">
        <span>Active days</span>
        <strong id="active-days">--</strong>
      </div>

      <div class="stat-card">
        <span>Project</span>
        <strong id="project-count">--</strong>
      </div>
    </section>

<section class="activity-section">
  <div class="section-header">
    <h2>Activity Heatmap</h2>
    <span class="heatmap-subtitle">Daily coding consistency</span>
  </div>
  <a href="https://heatmap.shymike.dev?id=32292&timezone=Asia%2FKarachi&labels=true&standalone=true" target="_blank"
    title="Click to view detailed data for each day!">
    <picture>
      <source media="(prefers-color-scheme: dark)"
        srcset="https://heatmap.shymike.dev?id=32292&timezone=Asia%2FKarachi&labels=true&theme=dark">
      <img alt="Hackatime activity heatmap"
        src="https://heatmap.shymike.dev?id=32292&timezone=Asia%2FKarachi&labels=true&theme=light"
        style="width: 100%; border-radius: 8px;">
    </picture>
  </a>
</section>

    <section class="projects-section">
      <h2>Projects using this language</h2>
      <div id="language-projects"></div>
    </section>

    <section class="github-section">
      <h2>GitHub</h2>
      <div id="github-projects"></div>
    </section>

  </main>
  <script src="js/stats.js"></script>
</body>

</html>
