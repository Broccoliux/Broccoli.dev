<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Broccoli Activity</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/stats.css">
</head>

<body>

  <main class="stats-main">
    <section class="stats-hero">

      <p class="stats-eyebrow">ENGINNEERING ACTIVITY</p>
      <h1 id="stats-language">Software Activity</h1>

      <p class="stats-description">
        Detailed development activity, projects, and time spent building.
      </p>
    </section>

    <section>
      <div class="stat-card">
        <span>Total Time</span>
        <strong id="total-hours">--</strong>
      </div>

      <div class="stat-card">
        <span>Active days</span>
        <strong id="active-days">--</strong>
      </div>

      <div class="stat-card">
        <span>Project</span>
        <strong id="project-count">--</strong>
      </div>
    </section>

    <section class="activity-section">
      <div class="section-header">
        <h2>Activity Heatmap (Last 84 Days)</h2>
        <span class="heatmap-subtitle">Daily coding consistency & volume</span>
      </div>
      <div class="heatmap-container" id="activity-heatmap"></div>
      <div class="heatmap-legend">
        <span>Less</span>
        <div class="legend-scale">
          <i class="legend-box level-0"></i>
          <i class="legend-box level-1"></i>
          <i class="legend-box level-2"></i>
          <i class="legend-box level-3"></i>
          <i class="legend-box level-4"></i>
        </div>
        <span>More</span>
      </div>
    </section>

    <section class="projects-section">
      <h2>Projects using this language</h2>
      <div id="language-projects"></div>
    </section>

    <section class="github-section">
      <h2>GitHub</h2>
      <div id="github-projects"></div>
    </section>

  </main>
  <script src="js/stats.js"></script>
</body>

</html>
